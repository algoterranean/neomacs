name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: macos-latest, experimental: false }
          # Windows is built and tested from the start but not released yet
          # (DISTRIBUTION P4), so its failures do not block.
          - { os: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install free-threaded Python
        run: uv python install 3.15t
      - name: Create environment
        run: |
          uv venv --python 3.15t .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: |
          uv run --python .venv ruff check .
          uv run --python .venv ruff format --check .
      - name: Type check
        run: npx --yes pyright
      - name: Test
        run: uv run --python .venv python -m pytest
      - name: API manifest is up to date
        run: uv run --python .venv python -m neomacs.tools.manifest --check
      - name: Latency benchmark (Gate B)
        # Shared runners are slow and noisy, so the limit here is three times
        # the 5 ms target; the target itself is checked on a development machine.
        run: uv run --python .venv python -m neomacs.tools.bench --keys 500 --check --limit-ms 15

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    # The real application, off screen, against a real engine: every check of
    # `npm run smoke`, among them the performance budgets of FRONTEND 11.
    name: electron smoke and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install free-threaded Python and the engine
        run: |
          uv python install 3.15t
          uv venv --python 3.15t .venv
          uv pip install --python .venv -e .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - name: Smoke test
        working-directory: frontend
        env:
          # The budgets are for a reference machine.  A shared runner drawing
          # without a graphics card is allowed a multiple, as the engine's
          # latency benchmark is.
          NEOMACS_BUDGET_SCALE: "4"
          # And longer to get through it all than a developer's machine needs.
          NEOMACS_SMOKE_TIMEOUT: "1200"
        run: |
          # Chromium's sandbox needs unprivileged user namespaces, which this
          # image restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum npm run smoke > smoke.log 2>&1 || status=$?
          grep -o 'SMOKE-RESULT {"ok":[a-z]*,"failures":\[[^]]*\]' smoke.log || tail -40 smoke.log
          # What each failing check found, and how far a run that timed out got.
          python3 - <<'PY'
          import json, re
          found = re.search(r"SMOKE-RESULT (\{.*\})", open("smoke.log").read())
          if found:
              report = json.loads(found.group(1))
              print(len(report["results"]), "checks reached; last:", list(report["results"])[-1:])
              for name in report["failures"]:
                  print(name, json.dumps(report["results"].get(name))[:3000])
          PY
          grep -o '"f5.performance_budgets":{[^}]*}[^}]*}[^}]*}[^}]*}[^}]*}[^}]*}[^}]*}' smoke.log || true
          exit ${status:-0}

  wheel:
    name: wheel installs and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15t
      - run: uv build --wheel
      - name: Install into a clean environment and start
        run: |
          uv venv --python 3.15t /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/neomacs --version
          /tmp/clean/bin/python - <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen(["/tmp/clean/bin/neomacs", "--stdio"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          p.stdin.write(b'{"jsonrpc":"2.0","id":1,"method":"engine.eval","params":["1 + 1"]}\n')
          p.stdin.flush()
          assert json.loads(p.stdout.readline())["result"] == "2"
          p.stdin.write(b'{"jsonrpc":"2.0","method":"engine.exit","params":[]}\n')
          p.stdin.flush()
          sys.exit(p.wait(timeout=10))
          PY
